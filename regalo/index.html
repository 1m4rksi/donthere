<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Felis cumple :v</title>
    <style>
        body {
            background-color: #000066;
            color: #ffff00;
            font-family: "Comic Sans MS", "Arial", sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        .container {
            border: 5px dashed #ff00ff;
            background-color: #ffffff;
            color: #ff0000;
            display: inline-block;
            padding: 40px;
            box-shadow: 10px 10px 0px #00ff00;
        }
        h1 {
            font-size: 40px;
            text-shadow: 3px 3px #00ffff;
        }
        .btn-tocame {
            background: linear-gradient(to bottom, #ff9900, #cc0000);
            color: #ffffff;
            font-size: 30px;
            font-weight: bold;
            font-family: "Comic Sans MS", cursive;
            padding: 15px 40px;
            border: 4px outset #ffff00;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn-tocame:active {
            border-style: inset;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ ¡SORPRESA! ✨</h1>
        <p style="font-size: 20px; color: #000000;">Hay una sorpresa esperándote...</p>
        
        <!-- Al hacer clic ejecuta una función antes de ir a cumple.html -->
        <a href="#" onclick="irACumple(event)" class="btn-tocame">¡TÓCAME!</a>
    </div>

    <script>
        function irACumple(event) {
            event.preventDefault();
            // Guardamos un aviso de que el usuario hizo click aquí
            localStorage.setItem('reproducirMusica', 'true');
            // Redirigimos a la página de cumple
            window.location.href = 'cumple.html';
        }
    </script>

</body>
</html>
